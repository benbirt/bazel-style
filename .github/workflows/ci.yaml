name: CI

# Formats and lints this repository with its own style(), and checks style()
# in a consumer workspace (tests/fixture) with tests/fixture_test.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Check formatting
        run: bazel run //tools:format.check
      - name: Lint Starlark
        run: bazel run //tools:lint
      - name: Test style() in a consumer
        run: tests/fixture_test.sh
